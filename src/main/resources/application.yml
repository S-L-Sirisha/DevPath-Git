server:
  port: ${PORT:8085}

spring:
  application:
    name: devpath-portal
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Management & Health Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# DevPath Custom Configuration
devpath:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLWRldnBhdGgtc3R1ZGVudC1wbGFjZW1lbnQtcG9ydGFsLWtleS0yMDI2LWRldm9wcw==}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  version: ${APP_VERSION:1.0.0}
  build-number: ${BUILD_NUMBER:1}
  environment: ${ENVIRONMENT:local-development}
