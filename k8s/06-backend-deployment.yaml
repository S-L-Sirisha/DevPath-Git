apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpath-backend-deployment
  labels:
    app: devpath-portal
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devpath-portal
      tier: backend
  template:
    metadata:
      labels:
        app: devpath-portal
        tier: backend
    spec:
      containers:
        - name: devpath-backend
          image: devpath-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: devpath-config
            - secretRef:
                name: devpath-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
